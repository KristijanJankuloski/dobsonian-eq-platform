<mat-toolbar color="primary" class="toolbar">
  <h1 class="app-title">Dobsonian EQ Platform Calculator</h1>
</mat-toolbar>

<main class="layout">
  <section class="panel" aria-label="Inputs">
    <app-inputs-form [(value)]="formValue" />
  </section>
  <section class="panel" aria-label="Results">
    <app-results [inputs]="inputs()" [result]="result()" />
  </section>
</main>
