<mat-toolbar color="primary" class="toolbar">
  <h1 class="app-title">Dobsonian EQ Platform Calculator</h1>
</mat-toolbar>

<main class="layout">
  <section class="panel" aria-label="Inputs">
    <app-inputs-form [(value)]="formValue" />
  </section>
  <section class="panel" aria-label="Results">
    <app-results [inputs]="inputs()" [result]="result()" />
  </section>

  @if (result(); as r) {
    <section class="sketches" aria-label="Marking-out sketches">
      <app-marking-sketch
        title="North segment"
        [radiusMm]="r.geometry.northRadiusMm"
        [angleDeg]="r.geometry.segmentAngleDeg"
        [cutChordMm]="r.geometry.northChordMm"
        testId="sketch-north"
      />
      <app-marking-sketch
        title="South segment"
        [radiusMm]="r.geometry.southRadiusMm"
        [angleDeg]="r.geometry.segmentAngleDeg"
        [cutChordMm]="r.geometry.southChordMm"
        testId="sketch-south"
      />
    </section>
  }
</main>
